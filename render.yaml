# =====================================================
# Render Blueprint — StudyNotion backend
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# The frontend is deployed separately on Vercel (see vercel.json).
#
# Database: Render allows only ONE free Postgres per account. If that slot
# is already used by another project, point this at an external free
# Postgres instead (e.g. neon.tech) by filling in the DB_* vars below —
# see DEPLOYMENT.md.
# =====================================================

services:
  - type: web
    name: studynotion-backend
    runtime: docker
    plan: free
    rootDir: studynotion-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # ── Database — fill in from your Postgres provider (e.g. Neon) ──
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PARAMS
        value: "?sslmode=require"

      # ── Auth ──
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"

      # ── Secrets — set these in the Render dashboard (sync:false) ──
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # ── Frontend / CORS — set to your Vercel URL after that deploy ──
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ── Runtime tuning ──
      - key: JPA_DDL_AUTO
        value: update
      - key: LOG_LEVEL_APP
        value: INFO
