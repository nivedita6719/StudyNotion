server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # respect X-Forwarded-* from Render's proxy
  error:
    include-message: always
    include-stacktrace: never

spring:
  application:
    name: studynotion-backend

  datasource:
    # Render's managed Postgres exposes host/port/db/user/password separately.
    # For local dev the DATABASE_URL / DB_* defaults below point at localhost.
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studynotion}}
    username: ${DB_USERNAME:${DB_USER:postgres}}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:105MB}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-please-override-minimum-32-bytes-long}
  expiration: ${JWT_EXPIRATION_MS:86400000}   # 24h

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  api-url: https://generativelanguage.googleapis.com/v1beta/models
  model: ${GEMINI_MODEL:gemini-2.5-flash}

# Comma-separated list of allowed browser origins. FRONTEND_URL is always allowed.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.studynotion: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: WARN
